# pinned benchmark toolchains (latest stable releases on 2026-10-11) and the one C library
# python bench/harness/bench.py fetch downloads/checks/unpacks them into .toolchains/
# rustup installs the Rust pin: rustup toolchain install 1.99.0 --profile minimal
#
# hosts without an entry fall back to PATH (the run records that it was not pinned)
# e.g. GCC on Linux (no official binaries exist)

[rust]
version = "1.99.0"

[zig]
version = "0.17.0"
bin = "."

[zig.x86_64-windows]
url = "https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip"
sha256 = "b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428"

[zig.x86_64-linux]
url = "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz"
sha256 = "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"

[zig.aarch64-linux]
url = "https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz"
sha256 = "9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8"

[llvm]
